    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/jpeg" href="/img/rowlet-logo.jpg" />
    <style>
      /* ── Webtoon reader ──
         Vertical-scroll reader: seamless stacked segments on white, so the page
         disappears and the art carries it. Prototype for the Starry Knight reader. */
      body.reader-body { background: #fff; }

      .reader-nav {
        position: sticky; top: 0; z-index: 20;
        background: rgba(255,255,255,0.90);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.10);
      }
      .reader-nav-inner {
        max-width: 900px; margin: 0 auto; padding: 10px 16px;
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      }
      .reader-nav a { color: #000; text-decoration: none; font-size: 13px; }
      .reader-nav a:hover { opacity: 0.6; }

      .reader-head {
        max-width: 720px; margin: 0 auto; padding: 3rem 1.25rem 2rem; text-align: center;
      }
      .reader-head h1 { color: #000; margin: 0; font-size: 1.6rem; }

      /* Segments butt together with no gap — the strip must read as one image. */
      .reader-strip { max-width: 900px; margin: 0 auto; padding: 0 0 1rem; font-size: 0; }
      /* height:auto lets the width/height attributes act as an aspect-ratio hint
         (reserving space before load) instead of a fixed, distorting height. */
      .reader-strip img { width: 100%; height: auto; display: block; margin: 0; }

      .reader-end {
        max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; text-align: center;
      }
      .reader-end p { color: #000; font-size: 14px; line-height: 1.7; }
      .reader-end .button {
        display: inline-block; margin-top: 1rem;
        background: #14151a; color: #fff; border: none;
      }
      .reader-end .button:hover { background: rgba(20,21,26,0.82); }

      .to-top {
        position: fixed; right: 18px; bottom: 18px; z-index: 30;
        width: 42px; height: 42px; border-radius: 50%;
        background: rgba(0,0,0,0.72); color: #fff;
        border: 1px solid rgba(0,0,0,0.14);
        font-size: 17px; line-height: 1; cursor: pointer;
        opacity: 0; pointer-events: none; transition: opacity 0.25s;
        backdrop-filter: blur(6px);
      }
      .to-top.show { opacity: 1; pointer-events: auto; }
      .to-top:hover { background: rgba(0,0,0,0.86); }

      @media (max-width: 600px) {
        .reader-head { padding: 2rem 1rem 1.5rem; }
        .reader-head h1 { font-size: 1.35rem; }
      }
    </style>
  </head>

  <body class="reader-body">
    <nav class="reader-nav">
      <div class="reader-nav-inner">
        <a href="/projects/character-panel.html">← Back to the Character &amp; Panel Generator page</a>
      </div>

    <header class="reader-head">
      <h1>Murim Test: Trevor X Ri Hwa Crossover</h1>
    </header>

    <div class="reader-strip">
      <!-- width/height are required here: without them each segment has zero
           intrinsic height until it loads, which collapses the strip and breaks
           both the scroll length and lazy-loading. -->
      <img src="/img/scene1/seg-01.jpg" alt="Scene 1, panel 1" width="900" height="501" loading="eager" />
      <img src="/img/scene1/seg-02.jpg" alt="Scene 1, panel 2" width="900" height="539" loading="eager" />
      <img src="/img/scene1/seg-03.jpg" alt="Scene 1, panel 3" width="900" height="479" loading="lazy" />
      <img src="/img/scene1/seg-04.jpg" alt="Scene 1, panel 4" width="900" height="748" loading="lazy" />
      <img src="/img/scene1/seg-05.jpg" alt="Scene 1, panel 5" width="900" height="511" loading="lazy" />

      <img src="/img/scene1/seg-09.jpg" alt="Scene 1, panel 9" width="900" height="772" loading="lazy" />

    </div>

    <div class="reader-end">
      <a class="button" href="/projects/character-panel.html">← How this was made</a>
    </div>

    <button class="to-top" id="toTop" aria-label="Back to top">↑</button>

    <script>
      (function () {
        var btn = document.getElementById('toTop');
        window.addEventListener('scroll', function () {
          btn.classList.toggle('show', window.scrollY > 900);
        }, { passive: true });
        btn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();
    </script>
  </body>
