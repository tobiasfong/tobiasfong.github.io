name: Deploy site to GitHub Pages

# Replaces GitHub's flaky auto-generated "pages build and deployment" workflow.
# This site is plain static HTML/CSS/JS — no Jekyll needed — so we skip the
# Jekyll build entirely and upload the files as-is. The deploy step is given a
# higher error tolerance so GitHub's occasionally-slow Pages backend doesn't
# trip the default 10-poll limit ("Deployment failed, try again later").

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage static site (exclude VCS/CI files)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000       # 15 min overall (default 10)
          error_count: 25       # tolerate GitHub's slow finalization (default 10)
          reporting_interval: 5000
